# Execution limits
limit: 1000            # Maximum instructions to execute
memory_size: 8192      # Memory size in bytes

# I/O configuration
memory_mapped_io:
  0x80: ['hello', 0xA]   # Input values at address 0x80
  0x84: []               # Output-only port at address 0x84

# Reports configuration
reports:
  - name: "Execution trace"
    slice: all
    view: |
      {pc}: {instruction} {pc:label}
      numio[0x80]: {io:0x84:sym}
      str: {memory:0x0:0x1F}
      acc: {Acc:hex} {Acc:dec}
      left_ptr: {memory:0x60:0x63}
      right_ptr: {memory:0x64:0x67}
  
  - name: "Result verification"
    slice: last
    view: |
      numio[0x84]: {io:0x84:sym}
    assert: |
      numio[0x84]: "" >>> "olleh"